<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2D33"/>
      <stop offset="1" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262C"/>
      <stop offset="1" stop-color="#1A1C20"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC23D"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3E46"/>
      <stop offset="1" stop-color="#25282D"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- macOS icon body -->
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <!-- amber glow behind the lit screen -->
    <rect x="540" y="300" width="220" height="200" rx="40" fill="#FF9F2A" opacity="0.45" filter="url(#glow)"/>

    <!-- 2x2 wall of screens -->
    <rect x="236" y="250" width="256" height="196" rx="30" fill="url(#screen)" stroke="#3B3F47" stroke-width="4"/>
    <rect x="532" y="250" width="256" height="196" rx="30" fill="url(#lit)"/>
    <rect x="236" y="480" width="256" height="196" rx="30" fill="url(#screen)" stroke="#3B3F47" stroke-width="4"/>
    <rect x="532" y="480" width="256" height="196" rx="30" fill="url(#screen)" stroke="#3B3F47" stroke-width="4"/>

    <!-- terminal lines on idle screens -->
    <g stroke-linecap="round" stroke-width="14">
      <line x1="276" y1="300" x2="400" y2="300" stroke="#4ADE80"/>
      <line x1="276" y1="336" x2="442" y2="336" stroke="#4A4F59"/>
      <line x1="276" y1="372" x2="372" y2="372" stroke="#4A4F59"/>

      <line x1="276" y1="530" x2="430" y2="530" stroke="#4A4F59"/>
      <line x1="276" y1="566" x2="380" y2="566" stroke="#4ADE80"/>
      <line x1="276" y1="602" x2="420" y2="602" stroke="#4A4F59"/>

      <line x1="572" y1="530" x2="700" y2="530" stroke="#4A4F59"/>
      <line x1="572" y1="566" x2="748" y2="566" stroke="#4A4F59"/>
      <line x1="572" y1="602" x2="660" y2="602" stroke="#60A5FA"/>
    </g>

    <!-- prompt on the lit screen: needs you -->
    <g fill="none" stroke="#1A1206" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="590,312 638,348 590,384"/>
      <line x1="666" y1="390" x2="732" y2="390"/>
    </g>

    <!-- the pit wall ledge -->
    <rect x="196" y="716" width="632" height="60" rx="22" fill="url(#wall)"/>
    <!-- chequered band on the wall -->
    <g fill="#E8E6E1" opacity="0.9">
      <rect x="236" y="732" width="28" height="14"/><rect x="264" y="746" width="28" height="14"/>
      <rect x="292" y="732" width="28" height="14"/><rect x="320" y="746" width="28" height="14"/>
      <rect x="348" y="732" width="28" height="14"/><rect x="376" y="746" width="28" height="14"/>
    </g>
    <circle cx="772" cy="746" r="12" fill="#FFB02E"/>
  </g>
  <!-- subtle rim -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
</svg>
